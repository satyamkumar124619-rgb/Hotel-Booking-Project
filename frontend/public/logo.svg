  <text x="100" y="45" font-family="serif" font-size="18" font-weight="normal" fill="#FFFFFF" text-anchor="middle">HOTEL</text>
  <circle cx="20" cy="30" r="8" fill="url(#goldGradient)"/>
  <circle cx="180" cy="30" r="8" fill="url(#goldGradient)"/>
